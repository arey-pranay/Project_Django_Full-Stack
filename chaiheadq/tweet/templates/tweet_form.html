{% extends "layout.html" %} {% block title %} Tweet List {% endblock %}
<!-- prettier-ignore -->
{% block content %}
<h1 class="text-center mt-4">Welcome to Django Tweets Project.</h1>
<h2>
  <!-- prettier-ignore -->
  {%if form.instance.pk %} Edit Tweet {% else %} Create tweet {% endif %}
  <!-- prettier-ignore -->
  <form method="post" enctype="multipart/form-data" class="form">
    {% csrf_token %} 
    {{ form.as_p }}
    <button class="btn btn-warning" type="submit">Submit</button>
  </form>
  <!-- prettier-ignore -->
  <a href="{% url 'tweet_list' %}" class="btn btn-primary">Back to tweet list</a>
</h2>

{% endblock %}
