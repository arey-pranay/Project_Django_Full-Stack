{% extends "layout.html" %} {% block title %} Tweet List {% endblock %}
<!-- prettier-ignore -->
{% block content %}
<h1 class="text-center mt-4">
  Are you sure that you want to delete this tweet?
</h1>
<form method="post" action="{% url 'tweet_delete' tweet_id=tweet.id %}">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Delete</button>
  <a class="btn btn-success" href="{% url 'tweet_list' %}">Cancel</a>
</form>
{% endblock %}
